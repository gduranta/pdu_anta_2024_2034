# ==============================================================================
# GEOVISOR DEL PLAN DE DESARROLLO URBANO (PDU) DE ANTA (2024 - 2034)
# MUNICIPALIDAD PROVINCIAL DE ANTA - GERENCIA DE DESARROLLO URBANO Y RURAL
#
# Configuración Oficial de Nginx Reverse Proxy con Blindaje SEC-05 (CWE-1021)
# Ubicación en servidor Linux: /etc/nginx/sites-available/geovisor_anta.conf
# Enlace simbólico: ln -s /etc/nginx/sites-available/geovisor_anta.conf /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Redirección HTTP hacia HTTPS (Puerto 80 -> 443)
server {
    listen 80;
    listen [::]:80;
    server_name geovisor.munianta.gob.pe pdu.munianta.gob.pe;

    # Desafío ACME para renovación automática Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    # Impedir acceso directo a capas, fuentes, código y documentos privados.
    location ~* ^/(data|data_pdu|normativa|aprobacion|R|scripts|outputs)(/|$) {
        deny all;
        return 404;
    }
}

# 2. Servidor Principal Seguro HTTPS (Puerto 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name geovisor.munianta.gob.pe pdu.munianta.gob.pe;

    # Certificados SSL / TLS Institucionales
    ssl_certificate /etc/letsencrypt/live/geovisor.munianta.gob.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geovisor.munianta.gob.pe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # BLINDAJE DE CIBERSEGURIDAD SEC-05: POLÍTICAS DE ENMARCADO Y MITIGACIÓN CLICKJACKING
    # --------------------------------------------------------------------------
    # frame-ancestors: Solo permite que el GeoVisor sea incrustado en el portal oficial
    # de GitHub Pages (https://gduranta.github.io) o en portales *.munianta.gob.pe
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' ws: wss: https://*.tile.openstreetmap.org https://server.arcgisonline.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://gduranta.github.io https://antapat.github.io https://*.munianta.gob.pe;" always;

    # Evita que el navegador realice MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Control de fuga de información de origen en peticiones de enlace
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP define las fuentes permitidas y reduce la superficie de XSS.`r`n    # CSP frame-ancestors permite el portal institucional; se omite X-Frame-Options,
    # que puede bloquear el iframe permitido según navegador.
    add_header Cache-Control "no-store" always;

    # Restricción de periféricos y permisos de navegador (Geolocalización GPS autorizada)
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;

    # Límite de carga para archivos Shapefile (ZIP) y GeoJSON en consultas de predio
    client_max_body_size 25M;

    # Logs de acceso y auditoría para la OTI
    access_log /var/log/nginx/geovisor_pdu_anta_access.log combined;
    error_log /var/log/nginx/geovisor_pdu_anta_error.log warn;

    # Proxy hacia el motor R Shiny (Puerto 3838)
    location / {
        # Solo loopback y redes privadas autorizadas pueden llegar al proxy.
        allow 127.0.0.1;
        # Reemplace esta regla por la subred LAN municipal real antes de publicar.
        allow 192.168.10.0/24;
        deny all;
        proxy_pass http://127.0.0.1:3838;
        proxy_http_version 1.1;

        # Configuración mandatoria para WebSockets de Shiny
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Encabezados de preservación del cliente original
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tiempos de espera extendidos para cálculo de intersecciones espaciales pesadas
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        # Desactivar buffering para streaming fluido de eventos Shiny
        proxy_buffering off;
    }
}

